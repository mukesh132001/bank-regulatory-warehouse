# Connection details come from environment variables (see .env.example).
# No password is stored here: dbt fails fast if POSTGRES_PASSWORD is not set.
bank_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'bank_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'bank_dw') }}"
      schema: public
      threads: 4
